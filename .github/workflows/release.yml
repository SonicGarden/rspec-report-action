name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options:
          - patch
          - minor
          - major
        required: true
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Ensure main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This workflow must be run on main (got $GITHUB_REF)"
            exit 1
          fi
      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Only strict vX.Y.Z tags count; bare major tags (v9) and pre-release tags (v2.1.0.pre1) are ignored
          latest=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            echo "::error::No existing vX.Y.Z tag found"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
            *)
              echo "::error::Unknown bump: $BUMP"
              exit 1
              ;;
          esac
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "$latest → v$next ($BUMP)" >> "$GITHUB_STEP_SUMMARY"
      - name: Create release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
      - name: Update major tag and its release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          major="${TAG%%.*}"
          if gh api "repos/$GH_REPO/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA"
          fi
          gh release view "$major" > /dev/null 2>&1 ||
            gh release create "$major" --title "$major" --notes "" --latest=false
