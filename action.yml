name: 'RSpec Report'
description: 'A GitHub Action that report RSpec failure.'
branding:
  icon: alert-triangle
  color: red
author: 'aki77'
inputs:
  token:
    description: 'Github token'
    required: false
    default: '${{ github.token }}'
  json-path:
    description: 'JSON File path'
    required: true
  title:
    description: 'Title'
    default: '# :cold_sweat: RSpec failure'
    required: false
  hideFooterLink:
    description: 'Hide footer link'
    default: 'false'
    required: false
  comment:
    description: 'Set this if want to comment report to pull request'
    default: 'true'
    required: false
  profileTitle:
    description: 'Title for profile'
    default: '# Slowest examples'
    required: false
  profile:
    description: 'Set this to false to disable the slowest examples comment'
    default: 'true'
    required: false
runs:
  using: 'composite'
  steps:
    - id: report
      shell: bash
      run: node "$GITHUB_ACTION_PATH/report.mjs"
      env:
        RSPEC_JSON_PATH: ${{ inputs.json-path }}
        RSPEC_TITLE: ${{ inputs.title }}
        RSPEC_HIDE_FOOTER_LINK: ${{ inputs.hideFooterLink }}
        RSPEC_PROFILE_TITLE: ${{ inputs.profileTitle }}

    - name: Update failure comment
      if: inputs.comment == 'true' && steps.report.outputs.pr-number != '' && steps.report.outputs.success == 'false'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: rspec-report-failure
        path: ${{ steps.report.outputs.failure-comment-path }}
        number_force: ${{ steps.report.outputs.pr-number }}
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Delete failure comment
      if: inputs.comment == 'true' && steps.report.outputs.pr-number != '' && steps.report.outputs.success == 'true'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: rspec-report-failure
        delete: true
        number_force: ${{ steps.report.outputs.pr-number }}
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Update profile comment
      if: inputs.comment == 'true' && inputs.profile == 'true' && steps.report.outputs.pr-number != ''
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: rspec-report-profile
        path: ${{ steps.report.outputs.profile-comment-path }}
        number_force: ${{ steps.report.outputs.pr-number }}
        GITHUB_TOKEN: ${{ inputs.token }}
